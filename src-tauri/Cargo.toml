[package]
name = "kehai"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A companion dashboard for a secondary display"
authors = ["Pulkit Sambhavi Singh"]
license = "MIT"
repository = "https://github.com/Purukitto/kehai"
homepage = "https://github.com/Purukitto/kehai"
readme = "../README.md"
keywords = ["dashboard", "tauri", "telemetry", "desktop"]
categories = ["gui"]
# A desktop binary, not a library anyone depends on.
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
base64 = "0.23.1"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel"] }
