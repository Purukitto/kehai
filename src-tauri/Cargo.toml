[package]
name = "kehai"
version = "0.9.1"
edition = "2021"
rust-version = "1.85"
description = "A companion dashboard for a secondary display"
authors = ["Pulkit Sambhavi Singh"]
license = "MIT"
repository = "https://github.com/Purukitto/kehai"
homepage = "https://github.com/Purukitto/kehai"
readme = "../README.md"
keywords = ["dashboard", "tauri", "telemetry", "desktop"]
categories = ["gui"]
# A desktop binary, not a library anyone depends on.
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
base64 = "0.23.1"
# Already in the tree through Tauri. The focus timer needs the local date to
# know when today ends.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tungstenite = "0.30"
httparse = "1"
getrandom = "0.3"
# While serving a remote panel, Kehai says on the local network that it is
# there (its name and port), so a paired tablet finds it at a new address.
mdns-sd = { version = "0.21.6", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_Foundation", "Win32_Devices_Display", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

# Already in the tree through Tauri. MPRIS players and the notification server
# are both on the session bus.
[target."cfg(target_os = \"linux\")".dependencies]
zbus = "5"
