name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  renderer:
    name: Renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tauri requires its Rust crate and its npm package to agree on
      # major.minor, and refuses to build when they do not — by exiting 0
      # without building anything. Dependabot updates cargo and npm in separate
      # pull requests, so the two drift apart one merge at a time. Catching it
      # here costs seconds; catching it at `tauri build` costs a release.
      - name: Check Rust and npm Tauri versions agree
        run: |
          set -euo pipefail
          crate_version() {
            awk -v n="$1" '$0 == "name = \"" n "\"" { found = 1; next }
                           found && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' \
              src-tauri/Cargo.lock
          }
          npm_version() {
            node -p "require('./node_modules/$1/package.json').version"
          }
          minor() { cut -d. -f1,2 <<< "$1"; }

          status=0
          check() {
            local crate npm cv nv
            crate=$1; npm=$2
            cv=$(crate_version "$crate"); nv=$(npm_version "$npm")
            if [ "$(minor "$cv")" != "$(minor "$nv")" ]; then
              echo "::error::$crate $cv and $npm $nv differ on major.minor"
              status=1
            else
              echo "ok  $crate $cv  ==  $npm $nv"
            fi
          }

          check tauri                   @tauri-apps/api
          check tauri-plugin-autostart  @tauri-apps/plugin-autostart
          exit $status

      # tsc runs with noUnusedLocals, noUnusedParameters and
      # noFallthroughCasesInSwitch, and is the only automated check on the
      # front end.
      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  engine:
    name: Engine
    # media.rs and notify.rs compile their real implementations only under
    # cfg(windows), so anywhere else leaves the interesting code unchecked.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  engine-stubs:
    name: Engine (non-Windows stubs)
    # The Linux media and notification sources only compile here, as do the
    # fallbacks for everywhere else, so this is what keeps them from rotting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
