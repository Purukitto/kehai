version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tauri-js:
        patterns: ['@tauri-apps/*']
      build:
        patterns: ['vite', '@vitejs/*', 'typescript']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      tauri:
        patterns: ['tauri', 'tauri-build', 'tauri-plugin-*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
